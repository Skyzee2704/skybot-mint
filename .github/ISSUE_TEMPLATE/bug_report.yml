name: Bug Report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not include private keys, seed phrases, API keys, or tokens.**
        Security vulnerabilities must be reported privately — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where Does It Happen?
      multiple: true
      options:
        - Web dashboard
        - Telegram Mini App
        - Telegram bot chat
        - Scheduled jobs (QStash)
        - Deployment / configuration
  - type: input
    id: chain
    attributes:
      label: Chain and Contract / Drop (if relevant)
      placeholder: "base, 0x… or https://opensea.io/…"
  - type: input
    id: version
    attributes:
      label: Version / Commit
      placeholder: "v1.0.0 or commit SHA"
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Redact any addresses or values you consider sensitive.
      render: shell
