name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build server package
        run: npm run build --workspace server
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
